<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryon • Watchlist</title>

  <style>
    :root {
      --bg: #070a10;
      --surface: #0c111b;
      --surface2: #0f1623;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.58);
      --accent: #5b8cff;
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system; }

    body { background: var(--bg); color: var(--text); padding-top: 78px; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(12,17,27,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 26px; z-index: 100; }
    .nav-left { display: flex; align-items: center; gap: 22px; }
    .nav-logo { font-weight: 950; font-size: 18px; cursor: pointer; }
    .nav-links { display: flex; gap: 10px; align-items: center; }
    .nav-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 12px; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.06); }

    .dropdown { position: relative; }
    .dropdown-menu { position: absolute; top: 44px; left: 0; min-width: 160px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: none; flex-direction: column; padding: 6px; }
    .dropdown:hover .dropdown-menu { display: flex; }
    .dropdown-menu button { background: transparent; border: none; text-align: left; padding: 10px 12px; color: rgba(255,255,255,0.75); border-radius: 10px; cursor: pointer; font-weight: 700; }
    .dropdown-menu button:hover { background: rgba(255,255,255,0.06); color: white; }

    .nav-right { display: flex; align-items: center; gap: 14px; }
    .profile { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#5b8cff,#2f6bff); display: grid; place-items: center; font-weight: 900; }
    .logout { padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: white; font-weight: 800; cursor: pointer; }
    .logout:hover { background: rgba(255,255,255,0.08); }

    .wrap { width: min(1000px,100%); margin: 0 auto; padding: 40px 26px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px; text-align: center; }
    .empty-icon { font-size: 48px; margin-bottom: 14px; }
    .empty-title { font-size: 22px; font-weight: 950; margin-bottom: 8px; }
    .empty-text { color: var(--muted); font-size: 14px; max-width: 420px; margin: 0 auto; }
    ul.watchlist { list-style: none; margin-top: 20px; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    ul.watchlist li { background: var(--surface2); padding: 10px 16px; border-radius: 12px; border: 1px solid var(--border); font-weight: 700; cursor: default; }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="nav-logo" onclick="location.href='index.html'">Cryon</div>
    <div class="nav-links">
      <button class="nav-btn" onclick="location.href='index.html'">Dashboard</button>
      <div class="dropdown">
        <button class="nav-btn">Trending ▾</button>
        <div class="dropdown-menu">
          <button>Top Gainers</button>
          <button>Top Losers</button>
          <button>24h Volume</button>
        </div>
      </div>
      <button class="nav-btn active">Watchlist</button>
    </div>
  </div>
  <div class="nav-right">
    <div class="profile">U</div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="wrap">
  <div id="emptyState" class="card">
    <div class="empty-icon">⭐</div>
    <div class="empty-title">Your watchlist is empty</div>
    <p class="empty-text">
      You haven’t added any coins yet.  
      Start exploring trending coins and add them to your watchlist.
    </p>
  </div>

  <ul id="watchlist" class="watchlist" style="display:none;"></ul>
</div>

<script>
  const API_BASE = "http://127.0.0.1:5000/api";
  const token = localStorage.getItem("token");

  // ✅ JWT check on page load
  if (!token) window.location.href = "signin.html";

  // ✅ Logout
  function logout() {
    localStorage.removeItem("token");
    window.location.href = "signin.html";
  }

  // ✅ Load watchlist
  async function loadWatchlist() {
    try {
      const res = await fetch(`${API_BASE}/watchlist`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.message || "Failed to fetch");

      const ul = document.getElementById("watchlist");
      const empty = document.getElementById("emptyState");

      if (data.length === 0) {
        empty.style.display = "block";
        ul.style.display = "none";
        return;
      }

      empty.style.display = "none";
      ul.style.display = "flex";
      ul.innerHTML = "";

      data.forEach(coin => {
        const li = document.createElement("li");
        li.innerText = coin;
        ul.appendChild(li);
      });
    } catch (err) {
      console.error(err);
      alert("Failed to load watchlist. Please login again.");
      logout();
    }
  }

  loadWatchlist();
</script>

</body>
</html>
