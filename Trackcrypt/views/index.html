<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryon</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #070a10;
      --surface: #0c111b;
      --surface2: #0f1623;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.58);
      --accent: #5b8cff;
      --green: #2ee59d;
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: ui-sans-serif, system-ui, -apple-system; }
    body { background: var(--bg); color: var(--text); padding-top: 78px; }

    .navbar { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(12,17,27,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 26px; z-index: 100; }
    .nav-left { display: flex; align-items: center; gap: 22px; }
    .nav-logo { font-weight: 950; font-size: 18px; cursor: pointer; }
    .nav-links { display: flex; gap: 10px; align-items: center; }
    .nav-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); font-weight: 800; cursor: pointer; padding: 8px 12px; border-radius: 12px; transition: 0.2s; }
    .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.06); }
    .dropdown { position: relative; }
    .dropdown-menu { position: absolute; top: 44px; left: 0; min-width: 160px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); display: none; flex-direction: column; padding: 6px; }
    .dropdown-menu button { background: transparent; border: none; text-align: left; padding: 10px 12px; color: rgba(255,255,255,0.75); border-radius: 10px; cursor: pointer; font-weight: 700; }
    .dropdown-menu button:hover { background: rgba(255,255,255,0.06); color: white; }
    .dropdown:hover .dropdown-menu { display: flex; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .profile { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#5b8cff,#2f6bff); display: grid; place-items: center; font-weight: 900; }
    .logout { padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: white; font-weight: 800; cursor: pointer; }
    .logout:hover { background: rgba(255,255,255,0.08); }
    .wrap { width: min(1180px,100%); margin: 0 auto; display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 26px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .left { padding: 22px; display: flex; flex-direction: column; gap: 18px; }
    .headline { font-size: 40px; font-weight: 950; }
    .subtext { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.6; }
    .right { padding: 16px; background: var(--surface2); display: grid; gap: 14px; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .stat, .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    canvas { width: 100% !important; height: 420px !important; }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="nav-logo" onclick="location.href='index.html'">Cryon</div>
    <div class="nav-links">
      <button class="nav-btn active">Dashboard</button>
      <div class="dropdown">
        <button class="nav-btn">Trending ▾</button>
        <div class="dropdown-menu">
          <button>Top Gainers</button>
          <button>Top Losers</button>
          <button>24h Volume</button>
        </div>
      </div>
      <button class="nav-btn" onclick="goToWatchlist()">Watchlist</button>
    </div>
  </div>
  <div class="nav-right">
    <div class="profile">U</div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="wrap">
  <section class="card left">
    <div class="headline">Crypto Dashboard</div>
    <p class="subtext">Track realtime crypto prices with a clean, minimal interface.</p>
  </section>

  <section class="card right">
    <div class="stats">
      <div class="stat"><p>Selected Coin</p><h3 id="selectedCoin">BTC</h3></div>
      <div class="stat"><p>Latest Price</p><h3 id="latestPrice">$ —</h3></div>
      <div class="stat"><p>Status</p><h3 style="color:var(--green)">Live</h3></div>
    </div>
    <div class="chart-card">
      <canvas id="lineChart"></canvas>
    </div>
  </section>
</div>

<script>
  const API_BASE = "http://127.0.0.1:5000/api";

  // ✅ JWT check on page load
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "signin.html"; // <- fixed redirect
  }

  // ✅ Logout function
  function logout() {
    localStorage.removeItem("token");
    window.location.href = "signin.html"; // <- fixed redirect
  }

  // ✅ Watchlist navigation
  function goToWatchlist() {
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "signin.html";
    } else {
      window.location.href = "watchlist.html";
    }
  }

  // ✅ Fetch dashboard data
  async function loadDashboard() {
    try {
      const res = await fetch(`${API_BASE}/dashboard`, {
        headers: { "Authorization": "Bearer " + token }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data?.message || "Failed to fetch");

      document.getElementById("selectedCoin").innerText = data.symbol;
      document.getElementById("latestPrice").innerText = "$" + data.price;

      // Chart
      if (data.history?.length) {
        new Chart(document.getElementById("lineChart"), {
          type: "line",
          data: {
            labels: data.history.map(h => h.time),
            datasets: [{ data: data.history.map(h => h.price), borderColor: "#5b8cff", tension: 0.3 }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    } catch (err) {
      console.error(err);
      alert("Failed to load dashboard. Please login again.");
      logout();
    }
  }

  loadDashboard();
</script>

</body>
</html>
