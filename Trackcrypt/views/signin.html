<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth</title>

  <style>
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #111827, #020617);
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: 400px;
      background: rgba(15, 23, 42, 0.85);
      padding: 28px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }
    h2 { margin-bottom: 4px; font-size: 24px; }
    p { font-size: 13px; opacity: 0.65; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tabs button {
      flex: 1; padding: 10px; border-radius: 12px; border: none; cursor: pointer;
      font-weight: 700; background: #020617; color: #9ca3af; transition: all 0.25s ease;
    }
    .tabs button.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      box-shadow: 0 8px 18px rgba(37,99,235,0.35);
    }
    label { font-size: 12px; opacity: 0.7; }
    input {
      width: 100%; padding: 11px; margin-top: 6px; margin-bottom: 14px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
      background: #020617; color: white;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.25); }
    button.submit {
      width: 100%; padding: 13px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white; font-weight: 800; cursor: pointer; margin-top: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button.submit:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(37,99,235,0.4); }
    .msg { margin-bottom: 12px; font-size: 13px; display: none; padding: 10px; border-radius: 10px; }
    .msg.error { color: #fecaca; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.35); }
    .msg.success { color: #bbf7d0; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.35); }
  </style>
</head>

<body>
  <div class="card">
    <div class="tabs">
      <button id="signupTab" class="active">Sign up</button>
      <button id="signinTab">Sign in</button>
    </div>

    <div id="msg" class="msg"></div>

    <h2 id="title">Create account</h2>
    <p id="desc">Sign up using email and password</p>

    <form id="form">
      <label>Email</label>
      <input id="email" type="email" required />

      <label>Password</label>
      <input id="password" type="password" required />

      <div id="confirmBox">
        <label>Confirm Password</label>
        <input id="confirm" type="password" />
      </div>

      <button class="submit" type="submit">Create account</button>
    </form>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:5000/api"; // Backend API base URL
    let mode = "signup";

    const signupTab = document.getElementById("signupTab");
    const signinTab = document.getElementById("signinTab");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const confirmBox = document.getElementById("confirmBox");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirm = document.getElementById("confirm");
    const msg = document.getElementById("msg");
    const form = document.getElementById("form");

    function setMode(m) {
      mode = m;
      msg.style.display = "none";
      if (m === "signup") {
        signupTab.classList.add("active");
        signinTab.classList.remove("active");
        confirmBox.style.display = "block";
        title.textContent = "Create account";
        desc.textContent = "Sign up using email and password";
        form.querySelector("button").textContent = "Create account";
      } else {
        signinTab.classList.add("active");
        signupTab.classList.remove("active");
        confirmBox.style.display = "none";
        title.textContent = "Welcome back";
        desc.textContent = "Sign in using email and password";
        form.querySelector("button").textContent = "Sign in";
      }
    }

    signupTab.onclick = () => setMode("signup");
    signinTab.onclick = () => setMode("signin");

    form.onsubmit = async (e) => {
      e.preventDefault();
      msg.style.display = "none";

      if (mode === "signup" && password.value !== confirm.value) {
        msg.textContent = "Passwords do not match";
        msg.className = "msg error";
        msg.style.display = "block";
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email.value, password: password.value })
        });

        const data = await res.json();

        if (!res.ok || !data.token) {
          msg.textContent = data?.error || "Auth failed";
          msg.className = "msg error";
          msg.style.display = "block";
          return;
        }

        // ✅ Store token in localStorage (frontend flow)
        localStorage.setItem("token", data.token);

        msg.textContent = "Success! Redirecting to dashboard…";
        msg.className = "msg success";
        msg.style.display = "block";

        setTimeout(() => {
          window.location.href = "index.html"; // Redirect to Dashboard
        }, 600);
      } catch (err) {
        msg.textContent = "Network error";
        msg.className = "msg error";
        msg.style.display = "block";
      }
    };
  </script>
</body>
</html>
