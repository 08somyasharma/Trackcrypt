<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | TrackCrypt</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(
          135deg,
          rgba(15, 23, 42, 0.95),
          rgba(30, 41, 59, 0.9)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }

      .page-wrapper {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .brand {
        margin-bottom: 2.5rem;
      }

      .brand-icon {
        font-size: 3rem;
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand-name {
        font-size: 2.2rem;
        font-weight: 800;
        margin-top: 0.5rem;
        background: linear-gradient(to right, #38bdf8, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand-tagline {
        margin-top: 0.4rem;
        color: var(--text-light);
        font-size: 0.95rem;
      }

      .login-box {
        margin-top: 2rem;
        background: rgba(30, 41, 59, 0.95);
        border-radius: 18px;
        padding: 2.5rem;
        border: 1px solid var(--border);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      }

      .login-title {
        font-size: 1.6rem;
        color: var(--text);
        margin-bottom: 0.4rem;
      }

      .login-subtitle {
        color: var(--text-light);
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      .form-group {
        margin-bottom: 1.3rem;
        text-align: left;
      }

      .form-input {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 10px;
        border: 2px solid var(--border);
        background: var(--bg-dark);
        color: var(--text);
        font-size: 0.95rem;
      }

      .form-input:focus {
        outline: none;
        border-color: var(--primary);
      }

      .btn-login {
        width: 100%;
        padding: 0.95rem;
        background: linear-gradient(135deg, #38bdf8, #8b5cf6);
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
      }

      .footer-text {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: var(--text-light);
      }

      .footer-text a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="page-wrapper">
      <!-- BRANDING -->
      <div class="brand">
        <i class="fas fa-chart-line brand-icon"></i>
        <div class="brand-name">TrackCrypt</div>
        <div class="brand-tagline">A Virtual Internship Project</div>
      </div>

      <!-- LOGIN BOX -->
      <div class="login-box">
        <div class="login-title">Welcome Back</div>
        <div class="login-subtitle">
          Sign in to continue to your dashboard
        </div>

        <form method="POST" action="/login">
          <div class="form-group">
            <input
              type="email"
              name="email"
              class="form-input"
              placeholder="Email address"
              required
            />
          </div>

          <div class="form-group">
            <input
              type="password"
              name="password"
              class="form-input"
              placeholder="Password"
              required
            />
          </div>

          <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="footer-text">
          Don’t have an account?
          <a href="/register">Create one</a>
        </div>
      </div>
    </div>

    {% if error %}
    <script>
      alert("{{ error }}");
    </script>
    {% endif %}
  </body>
</html>
