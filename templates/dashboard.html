<html>
<head>
    <title>TrackCrypt - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-chart-line logo-icon"></i>
            <h1>TrackCrypt</h1>
        </div>
        <nav>
            <a href="/" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <a href="/history" class="nav-link"><i class="fas fa-history"></i> History</a>
            <a href="/alerts" class="nav-link"><i class="fas fa-bell"></i> Alerts</a>

            {% if users and users.get(username) and users[username].role == 'admin' %}
                <a href="/admin" class="nav-link">
                    <i class="fas fa-user-shield"></i> Admin
                </a>
            {% endif %}

            <div class="user-info">
                <span class="username">{{ username }}</span>
                <a href="/logout" class="btn btn-secondary btn-sm">Logout</a>
            </div>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2>Live Cryptocurrency Tracking</h2>
            <div class="time-filter">
                <button class="time-btn active">24H</button>
                <button class="time-btn">7D</button>
                <button class="time-btn">1M</button>
                <button class="time-btn">1Y</button>
            </div>
        </div>

        <div class="crypto-cards">
            <div class="crypto-card">
                <div class="card-header">
                    <div class="coin-info">
                        <div class="coin-icon">BTC</div>
                        <div class="coin-name">
                            <h3>Bitcoin</h3>
                            <span class="coin-symbol">BTC/USD</span>
                        </div>
                    </div>
                </div>
                <div class="current-price" id="btc">$64,328.45</div>
            </div>

            <div class="crypto-card">
                <div class="card-header">
                    <div class="coin-info">
                        <div class="coin-icon">ETH</div>
                        <div class="coin-name">
                            <h3>Ethereum</h3>
                            <span class="coin-symbol">ETH/USD</span>
                        </div>
                    </div>
                </div>
                <div class="current-price" id="eth">$3,245.67</div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/prices.js') }}"></script>
</body>
</html>
